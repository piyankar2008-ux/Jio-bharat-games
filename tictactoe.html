<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tic Tac Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: monospace;
    }

    body {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 4px;
      width: 100vw;
      max-width: 240px; /* Locked to JioBharat screen size */
      margin: 0 auto;
    }
    
    h3 {
      font-size: 15px;
      margin: 3px 0;
      color: #ff0;
    }

    .menu-box {
      margin: 4px auto;
      display: flex;
      justify-content: center;
      gap: 4px;
    }

    .menu-box button {
      background: #222;
      color: #fff;
      border: 1px solid #fff;
      font-size: 11px;
      padding: 4px 6px;
      font-weight: bold;
    }
    
    #status {
      font-size: 14px;
      margin: 4px 0;
      color: #0ff;
    }

    /* CSS Grid guarantees a 3x3 layout on small screens */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      width: 180px; /* Fixed small width to prevent screen wrapping */
      margin: 6px auto;
      background: #333;
      padding: 3px;
      border: 2px solid #fff;
    }

    .cell {
      width: 100%;
      height: 52px;
      line-height: 52px;
      font-size: 24px;
      font-weight: bold;
      background: #111;
      color: #fff;
      border: 1px solid #444;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    #msg {
      font-size: 13px;
      margin: 4px 0;
      min-height: 18px;
      color: #0f0;
      font-weight: bold;
    }

    .help-map {
      font-size: 11px;
      color: #aaa;
      margin-top: 4px;
    }
    
    #restartBtn {
      background: #f00;
      color: #fff;
      font-size: 13px;
      padding: 6px 14px;
      border: 1px solid #fff;
      display: none;
      margin-top: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h3>TIC-TAC-TOE</h3>
  
  <div class="menu-box">
    <button onclick="setMode('AI')" id="btnAI" style="border-color:#0f0;">1. VS COMP</button>
    <button onclick="setMode('FRIEND')" id="btnFriend">2. VS FRIEND</button>
  </div>

  <div id="status">TURN: X</div>
  
  <!-- CSS Grid guarantees 3x3 structure -->
  <div class="grid">
    <div class="cell" onclick="pressCell(0)" id="c0">-</div>
    <div class="cell" onclick="pressCell(1)" id="c1">-</div>
    <div class="cell" onclick="pressCell(2)" id="c2">-</div>
    <div class="cell" onclick="pressCell(3)" id="c3">-</div>
    <div class="cell" onclick="pressCell(4)" id="c4">-</div>
    <div class="cell" onclick="pressCell(5)" id="c5">-</div>
    <div class="cell" onclick="pressCell(6)" id="c6">-</div>
    <div class="cell" onclick="pressCell(7)" id="c7">-</div>
    <div class="cell" onclick="pressCell(8)" id="c8">-</div>
  </div>
  
  <div id="msg">PRESS KEYPAD 1-9</div>
  
  <div class="help-map">
    1,2,3 (Top) | 4,5,6 (Mid) | 7,8,9 (Bot)
  </div>
  
  <div>
    <button onclick="resetGame()" id="restartBtn">PLAY AGAIN</button>
  </div>

  <script>
    var board = ["", "", "", "", "", "", "", "", ""];
    var currentPlayer = "X";
    var gameMode = "AI";
    var gameOver = false;

    var winPatterns = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    function setMode(mode) {
      gameMode = mode;
      document.getElementById("btnAI").style.borderColor = (mode === 'AI') ? '#0f0' : '#fff';
      document.getElementById("btnFriend").style.borderColor = (mode === 'FRIEND') ? '#0f0' : '#fff';
      resetGame();
    }

    function pressCell(index) {
      if (gameOver || board[index] !== "") return;

      makeMove(index, currentPlayer);

      if (checkWin(currentPlayer)) {
        document.getElementById("msg").innerHTML = currentPlayer + " WINS!";
        endGame();
        return;
      }

      if (board.indexOf("") === -1) {
        document.getElementById("msg").innerHTML = "IT'S A DRAW!";
        endGame();
        return;
      }

      if (gameMode === "FRIEND") {
        currentPlayer = (currentPlayer === "X") ? "O" : "X";
        document.getElementById("status").innerHTML = "TURN: " + currentPlayer;
      } else {
        document.getElementById("status").innerHTML = "THINKING...";
        gameOver = true;
        
        setTimeout(function() {
          gameOver = false;
          aiMove();
        }, 200);
      }
    }

    function makeMove(index, player) {
      board[index] = player;
      document.getElementById("c" + index).innerHTML = player;
    }

    function aiMove() {
      if (gameOver) return;

      var targetIndex = findSmartMove();

      if (targetIndex === -1) {
        var emptyCells = [];
        for (var i = 0; i < board.length; i++) {
          if (board[i] === "") emptyCells.push(i);
        }
        targetIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      }

      makeMove(targetIndex, "O");

      if (checkWin("O")) {
        document.getElementById("msg").innerHTML = "COMPUTER WINS!";
        endGame();
        return;
      }

      if (board.indexOf("") === -1) {
        document.getElementById("msg").innerHTML = "IT'S A DRAW!";
        endGame();
        return;
      }

      currentPlayer = "X";
      document.getElementById("status").innerHTML = "TURN: X";
    }

    function findSmartMove() {
      var actors = ["O", "X"];
      for (var a = 0; a < actors.length; a++) {
        var p = actors[a];
        for (var i = 0; i < winPatterns.length; i++) {
          var line = winPatterns[i];
          var count = 0;
          var emptyIdx = -1;
          for (var j = 0; j < 3; j++) {
            if (board[line[j]] === p) count++;
            else if (board[line[j]] === "") emptyIdx = line[j];
          }
          if (count === 2 && emptyIdx !== -1) return emptyIdx;
        }
      }
      return -1;
    }

    function checkWin(player) {
      for (var i = 0; i < winPatterns.length; i++) {
        var p = winPatterns[i];
        if (board[p[0]] === player && board[p[1]] === player && board[p[2]] === player) {
          return true;
        }
      }
      return false;
    }

    function endGame() {
      gameOver = true;
      document.getElementById("restartBtn").style.display = "inline";
    }

    function resetGame() {
      board = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      gameOver = false;
      document.getElementById("status").innerHTML = "TURN: X";
      document.getElementById("msg").innerHTML = "PRESS KEYPAD 1-9";
      document.getElementById("restartBtn").style.display = "none";
      
      for (var i = 0; i < 9; i++) {
        document.getElementById("c" + i).innerHTML = '-';
      }
    }

    document.onkeydown = function(e) {
      var k = e.key;
      if (k >= "1" && k <= "9") {
        var idx = parseInt(k) - 1;
        pressCell(idx);
      }
    };
  </script>
</body>
</html>
