<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circuit Line 6</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 4px;
    }

    h2 {
      font-size: 14px;
      color: #ff0;
      margin-bottom: 4px;
      border-bottom: 1px dashed #444;
      padding-bottom: 4px;
    }

    .level-select {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #111;
      border: 1px solid #444;
      padding: 4px;
      margin-bottom: 4px;
      font-size: 11px;
    }

    .info-box {
      border: 1px solid #444;
      background-color: #111;
      padding: 4px;
      margin-bottom: 4px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
    }

    .highlight { color: #0ff; font-weight: bold; }
    .green { color: #0f0; font-weight: bold; }

    .btn-nav {
      background-color: #333;
      color: #fff;
      border: 1px solid #777;
      padding: 3px 6px;
      font-size: 11px;
    }

    /* Single Column Vertical Container - No Grid */
    .vertical-container {
      border: 1px solid #444;
      background-color: #1a1a1a;
      padding: 4px;
      margin-bottom: 4px;
      display: block;
    }

    /* Single Row per Bulb */
    .circuit-row {
      display: block;
      margin-bottom: 4px;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 3px;
    }

    .bulb-area {
      display: block;
      margin: 0 auto 2px auto;
    }

    .bulb-svg {
      width: 24px;
      height: 24px;
      vertical-align: middle;
    }

    .bulb-label {
      font-size: 11px;
      font-weight: bold;
      margin-left: 6px;
    }

    .btn-switch {
      display: block;
      width: 100%;
      background-color: #222;
      color: #fff;
      border: 1px solid #666;
      font-size: 11px;
      font-weight: bold;
      padding: 5px 0;
    }

    .btn-switch:focus, .btn-switch:active {
      background-color: #008;
      color: #ff0;
      border-color: #fff;
    }

    .btn-action {
      display: block;
      width: 100%;
      background-color: #880;
      color: #fff;
      border: 1px solid #fff;
      font-size: 12px;
      font-weight: bold;
      padding: 6px 0;
      margin-top: 4px;
    }

    .btn-action:focus, .btn-action:active {
      background-color: #0f0;
      color: #000;
    }

    .btn-next { background-color: #080; }

    #log {
      color: #ff0;
      font-size: 10px;
      min-height: 20px;
      border: 1px solid #444;
      background-color: #111;
      padding: 4px;
    }
  </style>
</head>
<body>

  <h2>CIRCUIT LINE (6 SWITCHES)</h2>

  <!-- Level Selection Header -->
  <div class="level-select">
    <button class="btn-nav" onclick="changeLevel(-1)">&lt; PREV</button>
    <span>STAGE: <span id="stage" class="highlight">1</span>/50</span>
    <button class="btn-nav" onclick="changeLevel(1)">NEXT &gt;</button>
  </div>

  <div class="info-box">
    <span>GOAL: ALL 6 ON</span>
    <span>MOVES: <span id="moves" class="green">0</span></span>
  </div>

  <!-- Pure Vertical 1-Column Layout -->
  <div class="vertical-container">
    
    <!-- Row 1 -->
    <div class="circuit-row">
      <div class="bulb-area">
        <svg id="svg-0" class="bulb-svg" viewBox="0 0 32 32"></svg>
        <span id="txt-0" class="bulb-label">LINE 1</span>
      </div>
      <button class="btn-switch" onclick="pressSwitch(0)">FLIP SWITCH 1</button>
    </div>

    <!-- Row 2 -->
    <div class="circuit-row">
      <div class="bulb-area">
        <svg id="svg-1" class="bulb-svg" viewBox="0 0 32 32"></svg>
        <span id="txt-1" class="bulb-label">LINE 2</span>
      </div>
      <button class="btn-switch" onclick="pressSwitch(1)">FLIP SWITCH 2</button>
    </div>

    <!-- Row 3 -->
    <div class="circuit-row">
      <div class="bulb-area">
        <svg id="svg-2" class="bulb-svg" viewBox="0 0 32 32"></svg>
        <span id="txt-2" class="bulb-label">LINE 3</span>
      </div>
      <button class="btn-switch" onclick="pressSwitch(2)">FLIP SWITCH 3</button>
    </div>

    <!-- Row 4 -->
    <div class="circuit-row">
      <div class="bulb-area">
        <svg id="svg-3" class="bulb-svg" viewBox="0 0 32 32"></svg>
        <span id="txt-3" class="bulb-label">LINE 4</span>
      </div>
      <button class="btn-switch" onclick="pressSwitch(3)">FLIP SWITCH 4</button>
    </div>

    <!-- Row 5 -->
    <div class="circuit-row">
      <div class="bulb-area">
        <svg id="svg-4" class="bulb-svg" viewBox="0 0 32 32"></svg>
        <span id="txt-4" class="bulb-label">LINE 5</span>
      </div>
      <button class="btn-switch" onclick="pressSwitch(4)">FLIP SWITCH 5</button>
    </div>

    <!-- Row 6 -->
    <div class="circuit-row">
      <div class="bulb-area">
        <svg id="svg-5" class="bulb-svg" viewBox="0 0 32 32"></svg>
        <span id="txt-5" class="bulb-label">LINE 6</span>
      </div>
      <button class="btn-switch" onclick="pressSwitch(5)">FLIP SWITCH 6</button>
    </div>

  </div>

  <div id="gameplay-controls">
    <button class="btn-action" onclick="resetStage()">RESET STAGE</button>
  </div>

  <div id="next-stage-controls" style="display:none;">
    <button id="nextBtn" class="btn-action btn-next" onclick="nextStage()">NEXT STAGE</button>
  </div>

  <div id="log">Turn all 6 bulbs ON!</div>

  <script>
    var currentStage = 1;
    var moves = 0;
    var lights = [false, false, false, false, false, false];

    // Alternate Connection Matrix
    var connections = [
      [0, 2, 4], // Switch 1: Flips Odds (Line 1, 3, 5)
      [1, 3, 5], // Switch 2: Flips Evens (Line 2, 4, 6)
      [2, 0, 1], // Switch 3: Flips Line 3, 1, 2
      [3, 4, 5], // Switch 4: Flips Line 4, 5, 6
      [4, 0, 3], // Switch 5: Flips Line 5, 1, 4
      [5, 1, 2]  // Switch 6: Flips Line 6, 2, 3
    ];

    function applyFlip(arr, index) {
      var targets = connections[index];
      for (var i = 0; i < targets.length; i++) {
        var t = targets[i];
        arr[t] = !arr[t];
      }
    }

    function generateStage(stageNum) {
      var board = [true, true, true, true, true, true];
      
      var depth = 2 + Math.floor(stageNum / 6); 
      
      for (var d = 0; d < depth; d++) {
        var choice = (stageNum * 5 + d * 2) % 6;
        applyFlip(board, choice);
      }

      var allOn = board.every(function(v) { return v === true; });
      if (allOn) {
        applyFlip(board, 0);
      }

      return board;
    }

    function loadStage(stageNum) {
      moves = 0;
      lights = generateStage(stageNum);

      document.getElementById("stage").innerHTML = stageNum;
      document.getElementById("moves").innerHTML = "0";
      document.getElementById("gameplay-controls").style.display = "block";
      document.getElementById("next-stage-controls").style.display = "none";
      document.getElementById("log").innerHTML = "Stage " + stageNum + ": Turn all 6 bulbs ON!";

      renderCircuit();
    }

    function pressSwitch(index) {
      moves++;
      document.getElementById("moves").innerHTML = moves;

      applyFlip(lights, index);
      renderCircuit();
      checkWinCondition();
    }

    function renderCircuit() {
      for (var i = 0; i < 6; i++) {
        var svgEl = document.getElementById("svg-" + i);
        var txtEl = document.getElementById("txt-" + i);

        if (lights[i]) {
          svgEl.innerHTML = '<circle cx="16" cy="14" r="9" fill="#ff0" stroke="#fff" stroke-width="2"/>' +
                            '<line x1="16" y1="1" x2="16" y2="4" stroke="#ff0" stroke-width="2"/>' +
                            '<rect x="12" y="23" width="8" height="4" fill="#888"/>';
          txtEl.innerHTML = "LINE " + (i + 1) + ": ON";
          txtEl.style.color = "#0f0";
        } else {
          svgEl.innerHTML = '<circle cx="16" cy="14" r="9" fill="#222" stroke="#555" stroke-width="2"/>' +
                            '<rect x="12" y="23" width="8" height="4" fill="#444"/>';
          txtEl.innerHTML = "LINE " + (i + 1) + ": OFF";
          txtEl.style.color = "#888";
        }
      }
    }

    function checkWinCondition() {
      var allOn = lights.every(function(val) { return val === true; });

      if (allOn) {
        document.getElementById("gameplay-controls").style.display = "none";
        document.getElementById("next-stage-controls").style.display = "block";

        if (currentStage < 50) {
          document.getElementById("log").innerHTML = "<span class='green'>STAGE CLEAR!</span> Cleared in " + moves + " moves.";
          document.getElementById("nextBtn").innerHTML = "NEXT STAGE";
        } else {
          document.getElementById("log").innerHTML = "<span class='green'>VICTORY!</span> You beat all 50 levels!";
          document.getElementById("nextBtn").innerHTML = "PLAY AGAIN";
        }
      }
    }

    function changeLevel(delta) {
      currentStage += delta;
      if (currentStage < 1) currentStage = 50;
      if (currentStage > 50) currentStage = 1;
      loadStage(currentStage);
    }

    function nextStage() {
      changeLevel(1);
    }

    function resetStage() {
      loadStage(currentStage);
    }

    // Initialize level 1
    loadStage(1);
  </script>

</body>
</html>
