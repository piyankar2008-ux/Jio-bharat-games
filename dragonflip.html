<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Diagonal Flip - 50 Levels</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #000; color: #fff; text-align: center; width: 100vw; max-width: 240px; margin: 0 auto; padding: 5px; }
    h1 { font-size: 15px; color: #ff0; margin-bottom: 2px; }
    
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #38bdf8;
      margin-bottom: 6px;
      padding: 0 2px;
    }

    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; width: 100%; }
    
    .cell {
      height: 42px;
      border: 2px solid #555;
      font-size: 18px;
      font-weight: bold;
      background: #0284c7;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .cell.off { background: #111; color: #333; border-color: #222; }

    .msg { height: 18px; color: #0f0; font-weight: bold; font-size: 12px; margin-top: 6px; }

    .nav { display: flex; gap: 4px; margin-top: 6px; }
    
    .btn {
      flex: 1;
      padding: 6px 2px;
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn.primary { background: #008; border-color: #00f; }
  </style>
</head>
<body>

  <h1>DIAGONAL FLIP</h1>
  <div class="status-bar">
    <span>LEVEL: <b id="lvl-display" style="color:#ff0;">1</b>/50</span>
    <span>MOVES: <b id="moves-display" style="color:#fff;">0</b></span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="msg" id="msg"></div>

  <div class="nav">
    <button class="btn" onclick="prevLevel()">&lt; PREV</button>
    <button class="btn" onclick="resetLevel()">RESET</button>
    <button class="btn primary" onclick="nextLevel()">NEXT &gt;</button>
  </div>

  <script>
    const gridEl = document.getElementById('grid');
    const msgEl = document.getElementById('msg');
    const lvlEl = document.getElementById('lvl-display');
    const movesEl = document.getElementById('moves-display');
    
    let currentLevel = 1;
    let board = [];
    let moves = 0;
    let levelCleared = false;

    // Toggle logic for diagonal pattern
    function toggleCell(r, c) {
      if (r >= 0 && r < 4 && c >= 0 && c < 4) {
        const idx = r * 4 + c;
        board[idx] = board[idx] === 1 ? 0 : 1;
      }
    }

    function applyFlip(idx) {
      const r = Math.floor(idx / 4);
      const c = idx % 4;

      toggleCell(r, c);         // Center
      toggleCell(r - 1, c - 1); // Top-Left
      toggleCell(r - 1, c + 1); // Top-Right
      toggleCell(r + 1, c - 1); // Bottom-Left
      toggleCell(r + 1, c + 1); // Bottom-Right
    }

    // Dynamic Generator: Guarantees every level from 1 to 50 is 100% solvable
    function generateSolvableLevel(lvl) {
      board = Array(16).fill(0);
      
      // Calculate number of moves required (starts at 1 move, increases up to 6)
      const moveCount = Math.min(1 + Math.floor((lvl - 1) / 8), 6);
      
      // Generate deterministic tile picks based on Level ID
      for (let i = 0; i < moveCount; i++) {
        const targetTile = ((lvl * 7) + (i * 5) + 3) % 16;
        applyFlip(targetTile);
      }

      // If pattern accidentally turned all 0s, apply a fallback flip
      if (board.every(v => v === 0)) {
        applyFlip(lvl % 16);
      }
    }

    function loadLevel(lvl) {
      currentLevel = lvl;
      moves = 0;
      levelCleared = false;
      lvlEl.textContent = currentLevel;
      movesEl.textContent = moves;
      msgEl.textContent = '';
      
      generateSolvableLevel(currentLevel);
      render();
    }

    function handleClick(idx) {
      if (levelCleared) return;

      applyFlip(idx);
      moves++;
      movesEl.textContent = moves;
      render();

      if (board.every(val => val === 0)) {
        levelCleared = true;
        if (currentLevel === 50) {
          msgEl.textContent = 'CONGRATS! ALL 50 CLEARED!';
        } else {
          msgEl.textContent = 'CLEAR! CLICK NEXT >';
        }
      }
    }

    function render() {
      gridEl.innerHTML = '';
      board.forEach((val, i) => {
        const div = document.createElement('div');
        div.className = 'cell' + (val === 0 ? ' off' : '');
        div.textContent = val === 1 ? '1' : '0';
        div.onclick = () => handleClick(i);
        gridEl.appendChild(div);
      });
    }

    function nextLevel() {
      if (currentLevel < 50) {
        loadLevel(currentLevel + 1);
      }
    }

    function prevLevel() {
      if (currentLevel > 1) {
        loadLevel(currentLevel - 1);
      }
    }

    function resetLevel() {
      loadLevel(currentLevel);
    }

    // Start at Level 1
    loadLevel(1);
  </script>
</body>
</html>
