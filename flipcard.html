<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jio Timer Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 8px;
    }

    h2 {
      font-size: 15px;
      color: #ff0;
      margin-bottom: 8px;
    }

    .test-box {
      border: 2px solid #444;
      background: #111;
      padding: 8px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 12px;
      color: #0ff;
      font-weight: bold;
    }

    .number {
      font-size: 32px;
      font-weight: bold;
      color: #fff;
      margin: 4px 0;
    }

    .btn {
      display: block;
      width: 100%;
      background: #222;
      color: #fff;
      border: 2px solid #fff;
      padding: 6px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 4px;
    }

    .btn:active, .btn:focus {
      background: #008;
      border-color: #0f0;
      color: #ff0;
    }

    .btn-red {
      background: #800;
      border-color: #f00;
    }

    #reloadIframe {
      display: none; /* Keeps reload active in background without flashing the screen */
    }
  </style>
</head>
<body>

  <h2>JIOBHARAT TIMER TEST</h2>

  <!-- TEST 1: Standard JS setInterval -->
  <div class="test-box">
    <div class="title">1. NORMAL JS TIMER (setInterval)</div>
    <div class="number" id="jsNum">0</div>
    <button class="btn" id="jsStartBtn" onclick="startJsTimer()">START NORMAL TIMER</button>
    <button class="btn btn-red" id="jsStopBtn" onclick="stopJsTimer()" style="display:none;">STOP NORMAL TIMER</button>
  </div>

  <!-- TEST 2: Background Reload Timer (No white flash) -->
  <div class="test-box">
    <div class="title">2. BACKGROUND RELOAD TIMER</div>
    <div class="number" id="reloadNum">0</div>
    <button class="btn" id="reloadStartBtn" onclick="startReloadTimer()">START RELOAD TIMER</button>
    <button class="btn btn-red" id="reloadStopBtn" onclick="stopReloadTimer()" style="display:none;">STOP RELOAD TIMER</button>
  </div>

  <!-- Hidden iframe handles background reloads -->
  <iframe id="reloadIframe"></iframe>

  <script>
    // --- 1. NORMAL JS TIMER LOGIC ---
    var jsCount = 0;
    var jsTimer = null;

    function startJsTimer() {
      if (jsTimer) return;
      document.getElementById("jsStartBtn").style.display = "none";
      document.getElementById("jsStopBtn").style.display = "block";

      jsTimer = setInterval(function() {
        jsCount++;
        document.getElementById("jsNum").innerHTML = jsCount;
      }, 1000);
    }

    function stopJsTimer() {
      clearInterval(jsTimer);
      jsTimer = null;
      document.getElementById("jsStartBtn").style.display = "block";
      document.getElementById("jsStopBtn").style.display = "none";
    }

    // --- 2. RELOAD TIMER LOGIC ---
    var reloadCount = 0;
    var reloadActive = false;

    function startReloadTimer() {
      reloadActive = true;
      document.getElementById("reloadStartBtn").style.display = "none";
      document.getElementById("reloadStopBtn").style.display = "block";
      triggerBackgroundReload();
    }

    function stopReloadTimer() {
      reloadActive = false;
      document.getElementById("reloadStartBtn").style.display = "block";
      document.getElementById("reloadStopBtn").style.display = "none";
    }

    function triggerBackgroundReload() {
      if (!reloadActive) return;

      reloadCount++;
      document.getElementById("reloadNum").innerHTML = reloadCount;

      // Force background frame reload without refreshing main page
      var iframe = document.getElementById("reloadIframe");
      iframe.src = "about:blank"; // Clears cache memory

      setTimeout(function() {
        if (reloadActive) {
          triggerBackgroundReload();
        }
      }, 1000);
    }
  </script>

</body>
</html>
