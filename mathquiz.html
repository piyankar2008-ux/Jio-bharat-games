    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Quiz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 8px;
    }

    h2 {
      font-size: 16px;
      color: #ff0;
      margin-bottom: 6px;
    }

    .score-board {
      font-size: 13px;
      color: #fff;
      margin-bottom: 10px;
    }

    .problem-box {
      font-size: 24px;
      font-weight: bold;
      color: #0ff;
      border: 2px solid #555;
      background-color: #111;
      padding: 10px 0;
      margin-bottom: 12px;
    }

    .answers {
      display: block;
    }

    /* Standard block buttons stack vertically — 100% reliable */
    .ans-btn {
      display: block;
      width: 100%;
      background-color: #222;
      color: #fff;
      border: 2px solid #fff;
      font-size: 16px;
      font-weight: bold;
      padding: 8px 0;
      margin-bottom: 6px;
    }

    .ans-btn:focus,
    .ans-btn:active {
      background-color: #008;
      border-color: #0f0;
      color: #ff0;
    }

    #msg {
      font-size: 14px;
      font-weight: bold;
      color: #0f0;
      margin-top: 6px;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <h2>MATH QUIZ</h2>
  <div class="score-board">SCORE: <span id="score">0</span></div>

  <div class="problem-box" id="problem">0 + 0</div>

  <div class="answers">
    <button class="ans-btn" id="opt0" onclick="checkAnswer(0)">Option 1</button>
    <button class="ans-btn" id="opt1" onclick="checkAnswer(1)">Option 2</button>
    <button class="ans-btn" id="opt2" onclick="checkAnswer(2)">Option 2</button>
  </div>

  <div id="msg"></div>

  <script>
    var currentAnswer = 0;
    var score = 0;

    function generateQuestion() {
      // Simple arithmetic numbers
      var num1 = Math.floor(Math.random() * 20) + 1;
      var num2 = Math.floor(Math.random() * 20) + 1;
      var isPlus = Math.random() > 0.5;

      if (isPlus) {
        currentAnswer = num1 + num2;
        document.getElementById("problem").innerHTML = num1 + " + " + num2;
      } else {
        // Ensure non-negative answer
        if (num1 < num2) {
          var temp = num1;
          num1 = num2;
          num2 = temp;
        }
        currentAnswer = num1 - num2;
        document.getElementById("problem").innerHTML = num1 + " - " + num2;
      }

      // Generate options
      var correctSlot = Math.floor(Math.random() * 3);
      var options = [];

      for (var i = 0; i < 3; i++) {
        if (i === correctSlot) {
          options.push(currentAnswer);
        } else {
          var wrong = currentAnswer + (Math.floor(Math.random() * 6) - 3);
          if (wrong === currentAnswer || wrong < 0 || options.indexOf(wrong) !== -1) {
            wrong = currentAnswer + i + 2;
          }
          options.push(wrong);
        }
      }

      document.getElementById("opt0").innerHTML = options[0];
      document.getElementById("opt1").innerHTML = options[1];
      document.getElementById("opt2").innerHTML = options[2];

      document.getElementById("opt0").dataset.val = options[0];
      document.getElementById("opt1").dataset.val = options[1];
      document.getElementById("opt2").dataset.val = options[2];
    }

    function checkAnswer(index) {
      var selectedVal = parseInt(document.getElementById("opt" + index).dataset.val);

      if (selectedVal === currentAnswer) {
        score += 10;
        document.getElementById("msg").style.color = "#0f0";
        document.getElementById("msg").innerHTML = "CORRECT!";
      } else {
        score = Math.max(0, score - 5);
        document.getElementById("msg").style.color = "#f00";
        document.getElementById("msg").innerHTML = "WRONG!";
      }

      document.getElementById("score").innerHTML = score;
      generateQuestion();
    }

    // Initialize game statically
    generateQuestion();
  </script>

</body>
</html>
