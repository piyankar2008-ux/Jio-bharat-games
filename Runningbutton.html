<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <style>
  #container{
    justify-content: center;
    width: 300px;
    height: 300px;
    border: 5px solid black;
    position: relative;
    margin: auto;
  }
  #message{
    font-family:cursive;
    font-size:30px;
  }
    #message2{
    font-family:cursive;
    font-size:30px;
    display:none;
  }
    #yes{
      color: white;
      background-color: green;
      font-family: cursive;
      border:none;
      padding-left: 20px;
      padding-right: 20px;
      text-align: center;
    }
    a{
      color: white;
      background-color: red;
      font-family: cursive;
      border:none;
      padding-left: 20px;
      padding-right: 20px;
      text-align: center;
      text-decoration: none;
       transition:transform 3s ease;
      transform:translateX(0);
      transform:translateY(0);
      transition:border-raduis 3s ease;
      position:absolute;
    }
    a:hover
    {
      transform:translateX(400px);
      transform:translateY(300px);
      border-radius:100px;
      
    }
  </style>
</head>
<body>
  <div id="container">
  <div id="message">
    Virat Kohli is king
  </div>
  <button id="yes"> yes</button>
  <div id="message2">Yes you are right Virat is King</div>
  <a href="#">No</a>
  </div>
  <script>
    let btn=document.getElementById("yes")
    let mess=document.getElementById("message2")
    btn.addEventListener("click",function(){
      if(mess.style.display=="none")
      {
        mess.style.display="flex"
      }
      else{
        mess.style.display="flex"
      }
    }
    )
  </script>
</body>
</html>
